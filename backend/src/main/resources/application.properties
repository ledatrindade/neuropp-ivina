spring.application.name=neuropp-ivina-api
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/neuropp_db}
spring.datasource.username=${DB_USERNAME:neuropp_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.time-zone=${APP_TIME_ZONE:America/Recife}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:neuropp-ivina-api}
app.jwt.audience=${JWT_AUDIENCE:neuropp-ivina-web}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.rate-limit.login-max-requests=${LOGIN_RATE_LIMIT_MAX:10}
app.rate-limit.login-window=${LOGIN_RATE_LIMIT_WINDOW:PT1M}
app.rate-limit.registration-max-requests=${REGISTRATION_RATE_LIMIT_MAX:5}
app.rate-limit.registration-window=${REGISTRATION_RATE_LIMIT_WINDOW:PT1H}

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
