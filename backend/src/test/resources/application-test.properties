spring.datasource.url=jdbc:h2:mem:neuropp_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.time-zone=America/Recife
app.security.bcrypt-strength=4
app.jwt.secret=test-secret-with-at-least-thirty-two-characters-123456
app.jwt.issuer=neuropp-test
app.jwt.audience=neuropp-test-client
app.jwt.access-token-ttl=PT15M
app.cors.allowed-origins=http://localhost:5173
app.rate-limit.login-max-requests=100
app.rate-limit.login-window=PT1M
app.rate-limit.registration-max-requests=100
app.rate-limit.registration-window=PT1M
app.bootstrap-admin.enabled=false
