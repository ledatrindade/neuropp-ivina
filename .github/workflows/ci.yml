name: NeuroPP CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuropp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes com Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e validações do backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend — lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o código com ESLint
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build